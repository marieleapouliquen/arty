# Menu de la colonne de gauche.
# Un élément avec `group` forme une rubrique (intitulé non cliquable + liens en retrait),
# un élément avec `title` + `url` est un lien simple.
# Les URL commencent par « / » : le baseurl est ajouté automatiquement.

- group: photographie
  items:
    - title: adk
      url: /adk/
    - title: autumn
      url: /autumn/
    - title: flowers
      url: /
    - title: mountains
      url: /mountains/
    - title: water
      url: /water/

- group: peinture et dessin
  items:
   - title: clay
     url: /clay/
   - title: oil
     url: /oil/
  #- title: watercolor
  #    url: /watercolor/

- title: à propos
  url: /a-propos/
